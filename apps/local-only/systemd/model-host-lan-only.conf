# Targeted egress firewall for the local model server, applied to one unit only.
#
# Install as a drop-in of the model service:
#
#   sudo install -D -m 644 apps/local-only/systemd/model-host-lan-only.conf \
#     /etc/systemd/system/strata-nvfp4.service.d/lan-only.conf
#   sudo systemctl daemon-reload && sudo systemctl restart strata-nvfp4
#
# systemd filters IP packets both ways for the unit's sockets: the source
# address on ingress, the destination address on egress. Everything that is not
# loopback or the home LAN is dropped for this service, which also blocks the
# host's public IPv6 and the tailscale0 mesh address — while the rest of the
# machine, including development tools and model downloads run by hand, keeps
# its internet access. Allow entries win over Deny, and binding to 0.0.0.0 is
# unaffected because the check is per packet, not per bind.
#
# Site-local IPv6 (fd00::/8) is deliberately NOT allowed: on this host that range
# belongs to tailscale. The client must reach the server over 192.168.0.x.
#
# Remove with:
#   sudo rm -rf /etc/systemd/system/strata-nvfp4.service.d/lan-only.conf
#   sudo systemctl daemon-reload && sudo systemctl restart strata-nvfp4

[Service]
IPAddressAllow=127.0.0.0/8 192.168.0.0/24 ::1/128 fe80::/10
IPAddressDeny=any
